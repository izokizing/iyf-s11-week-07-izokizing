<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note APP</title>
</head>
<body>
    <h1>Note App</h1>

    <textarea id="noteInput" placeholder="Write your note here"></textarea>
    <br><br>

    <button id="saveBtn">Save Note</button>
    <h2>My Notes</h2>
    <ul id="notesList"></ul>
    
    <div class="container">
    <h1>My To-Do List</h1>

    <form id="todo-form">
       <input type="text" id="todo-input" placeholder="What needs to be dpne?" required>
       <button type="submit">Add</button>
    </form>

    <div class="filters">
       <button class="filter active" data-filter="all">All</button>
       <button class="filter " data-filter="all">Active</button>
       <button class="filter active" data-filter="completed">Completed</button>
    </div>
    <ul id="todo-list">
        
    </ul>
      
    <div class="stats">
       <span id="items-left">0 items left</span>
       <button id="clear-completed">Clear completed</button>
    </div>




    <script src="app.js"></script>
    
</body>
</html>
